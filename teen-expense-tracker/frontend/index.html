<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#6750a4" />
    <title>TeenSpend</title>
    <style>
      body { margin: 0; font-family: Inter, ui-sans-serif, system-ui, sans-serif; color: #1d1b20; background: #f9f9ff; }
      .fallback-shell { min-height: 100vh; display: grid; place-items: center; padding: 24px; box-sizing: border-box; }
      .fallback-card { width: min(680px, 100%); padding: clamp(28px, 7vw, 64px); border-radius: 28px; box-sizing: border-box; background: linear-gradient(145deg, #f4efff, #fff); box-shadow: 0 18px 55px #352b4620; }
      .fallback-eyebrow { color: #6750a4; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; }
      .fallback-card h1 { margin: 14px 0; font-size: clamp(2rem, 6vw, 4rem); line-height: 1.04; }
      .fallback-card p { color: #49454f; font-size: 1.06rem; line-height: 1.6; }
      .fallback-status { display: inline-block; margin-top: 12px; padding: 9px 14px; border-radius: 999px; color: #245c2a; background: #d9f8d8; font-weight: 700; }
    </style>
  </head>
  <body>
    <div id="root">
      <main class="fallback-shell">
        <section class="fallback-card" aria-labelledby="fallback-title">
          <span class="fallback-eyebrow">TeenSpend</span>
          <h1 id="fallback-title">Track it. Understand it. Spend smarter.</h1>
          <p>Your friendly money tracker is ready.</p>
          <span class="fallback-status">Project setup complete</span>
        </section>
      </main>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
